name: Release images

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  REGISTRY: docker.mohntechnology.no
  WEB_IMAGE: docker.mohntechnology.no/mohntechnology.no
  API_IMAGE: docker.mohntechnology.no/mohntechnology-contactapi

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image tag from git tag
        id: meta
        run: |
          TAG="${GITHUB_REF_NAME}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Log in to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.web
          push: true
          tags: |
            ${{ env.WEB_IMAGE }}:${{ steps.meta.outputs.tag }}
            ${{ env.WEB_IMAGE }}:latest
          build-args: |
            PUBLIC_CONTACT_API_URL=https://mohntechnology.no/api/contact

      - name: Build and push contactapi
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.contactapi
          push: true
          tags: |
            ${{ env.API_IMAGE }}:${{ steps.meta.outputs.tag }}
            ${{ env.API_IMAGE }}:latest
